<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;max-width:400px;margin:40px auto;padding:16px; background-image:url('/assets/background.jpg'); background-size:cover; background-position:center;">
  <div class="page-shell">
  <h1>Admin Login</h1>
  <form id="login">
    <label>Password<input name="password" type="password" required></label>
    <button>Login</button>
  </form>
  </div>
  <div id="msg" aria-live="polite"></div>
  <script>
    document.getElementById('login').addEventListener('submit', async e=>{
      e.preventDefault(); const p=new FormData(e.target).get('password');
      const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
      const j=await r.json(); const msg=document.getElementById('msg');
      if(r.ok){ localStorage.setItem('admin_token', j.token); msg.style.color='green'; msg.textContent='Logged in'; setTimeout(()=>location.href='/admin/dashboard.html',400); }
      else { msg.style.color='maroon'; msg.textContent=j.error||'Failed' }
    })
  </script>
</body></html>
