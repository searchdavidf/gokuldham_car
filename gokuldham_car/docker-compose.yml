version: '3.8'
services:
  backend:
    build: ./backend
    container_name: society-backend
    restart: always
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data.sqlite:/app/data.sqlite

  nginx:
    image: nginx:stable
    container_name: society-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/letsencrypt
      - ./frontend/build:/usr/share/nginx/html:ro

volumes:
  uploads:
  db:
